services:
  postgres:
    image: postgres:17
    container_name: checkout-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: checkout_db
    ports:
      - "5432:5432"
    volumes:
      - checkout_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d checkout_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - checkout-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: checkout-service
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      APP_NAME: CHECKOUT-SVC
      APP_VERSION: v1.0.0
      APP_HTTP_PORT: 9000
      APP_GRPC_PORT: 9001
      DB_DRIVER: postgres
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: checkout_db
      DB_HOST: postgres
      DB_PORT: 5432
      DB_MAX_IDLE_CONN: 10
      DB_MAX_OPEN_CONN: 100
      DB_MAX_CONN_LIFETIME: 60s
      DB_SSL_MODE: disable
      DB_ENABLE_DEBUG: true
      LOGGER_ENABLE: true
      LOGGER_ENABLE_STACK_TRACE: false
      LOGGER_ENABLE_MASKING: true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - checkout-network

volumes:
  checkout_postgres_data:

networks:
  checkout-network:
    driver: bridge
